services:
  yurigarden-unscrambler:
    build: .
    container_name: yurigarden-unscrambler
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      JPEG_QUALITY: "${JPEG_QUALITY:-92}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-16}"
      CACHE_MAX_MB: "${CACHE_MAX_MB:-256}"
      CACHE_TTL: "${CACHE_TTL:-30m}"
      UPSTREAM_TIMEOUT: "${UPSTREAM_TIMEOUT:-20s}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
